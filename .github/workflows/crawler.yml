name: run crawler script

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js version
        uses: actions/setup-node@v1
        with:
          node-version: "18.x"

      - name: Install dependencies & run
        run: |
          yarn
          node crawData.js
